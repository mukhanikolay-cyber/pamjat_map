<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>точки — редактор</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  html,body{margin:0;height:100%;font:13px/1.4 system-ui,Arial,sans-serif}
  #app{display:flex;height:100vh}
  #map{flex:1}
  #bok{width:400px;overflow:auto;border-left:1px solid #ccc;background:#f7f7f7;padding:10px;box-sizing:border-box}
  .row{display:flex;gap:4px;align-items:center;padding:3px 4px;border-bottom:1px solid #e5e5e5}
  .row input{width:88px;font:12px monospace;padding:1px 3px}
  .row .n{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row.hl{background:#ffe9a8}
  .row.mv .n::after{content:" ✱";color:#c60}
  .bt{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
  button{padding:5px 9px;cursor:pointer;border:1px solid #888;background:#fff;border-radius:3px}
  button.g{background:#2a7;color:#fff;border-color:#186}
  textarea{width:100%;height:180px;font:12px monospace;box-sizing:border-box}
  #st{padding:4px 6px;background:#eee;border-radius:3px;margin:4px 0;font-size:12px}
</style>
</head>
<body>
<div id="app">
  <div id="map"></div>
  <div id="bok">
    <div id="st">загрузка…</div>
    <div class="bt">
      <input type="file" id="f" accept=".json">
      <button id="perez">перечитать с диска/гита</button>
    </div>
    <div class="bt">
      <button class="g" id="kop">скопировать points.json</button>
      <button id="skach">скачать</button>
      <button id="otkat">откат</button>
    </div>
    <div id="list"></div>
    <textarea id="out" spellcheck="false"></textarea>
  </div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// где искать файл если он не рядом с html
const URLa = [
  './points.json',
  'https://raw.githubusercontent.com/mukhanikolay-cyber/pamjat_map/main/points.json',
  'https://raw.githubusercontent.com/mukhanikolay-cyber/pamjat_map/master/points.json',
  'https://mukhanikolay-cyber.github.io/pamjat_map/points.json'
];

let orig = [];
let to4ki = [];
let mki = new Map();
let otkryt = 0;

const karta = L.map('map', {zoomControl:true}).setView([53.7,27.9],7);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  maxZoom:19, attribution:'© OpenStreetMap'
}).addTo(karta);
const sloj = L.layerGroup().addTo(karta);

function Status(t){
  document.getElementById('st').textContent = t;
}

async function Najdi(){
  for(const u of URLa){
    try{
      const r = await fetch(u, {cache:'no-store'});
      if(!r.ok) continue;
      const j = await r.json();
      if(Array.isArray(j) && j.length){
        Status('загружено: '+u+' ('+j.length+')');
        return j;
      }
    }catch(e){}
  }
  return null;
}

function Zagruzit(arr){
  sloj.clearLayers();
  mki.clear();
  orig = JSON.parse(JSON.stringify(arr));
  to4ki = JSON.parse(JSON.stringify(arr));
  to4ki.forEach(Poставит);
  if(to4ki.length){
    const b = L.latLngBounds(to4ki.map(p=>[p.lat,p.lng]));
    karta.fitBounds(b.pad(0.08));
  }
  Spisok();
  Vyvod();
}

function Poставит(p){
  const m = L.marker([p.lat,p.lng],{draggable:true,title:p.name}).addTo(sloj);
  m.bindTooltip(`${p.name} (#${p.id})`,{direction:'top',offset:[0,-6]});
  m.on('drag', e=>{
    const ll = e.target.getLatLng();
    p.lat = +ll.lat.toFixed(6);
    p.lng = +ll.lng.toFixed(6);
    Obnovit(p);
    Vyvod();
  });
  m.on('dragend', Spisok);
  m.on('click', ()=>{
    const r = document.querySelector(`.row[data-id="${p.id}"]`);
    if(r){
      document.querySelectorAll('.hl').forEach(x=>x.classList.remove('hl'));
      r.classList.add('hl');
      r.scrollIntoView({block:'center',behavior:'smooth'});
    }
  });
  mki.set(p.id, m);
}

function Spisok(){
  const L2 = document.getElementById('list');
  L2.innerHTML = '';
  for(const p of to4ki){
    const r = document.createElement('div');
    r.className = 'row' + (Izm(p)?' mv':'');
    r.dataset.id = p.id;

    const n = document.createElement('span');
    n.className = 'n';
    n.textContent = `${p.id}. ${p.name}`;

    const a = document.createElement('input');
    a.type='number'; a.step='0.000001'; a.value=p.lat;
    a.onchange = ()=>{
      p.lat = parseFloat(a.value);
      mki.get(p.id)?.setLatLng([p.lat,p.lng]);
      Vyvod(); Obnovit(p);
    };

    const o = document.createElement('input');
    o.type='number'; o.step='0.000001'; o.value=p.lng;
    o.onchange = ()=>{
      p.lng = parseFloat(o.value);
      mki.get(p.id)?.setLatLng([p.lat,p.lng]);
      Vyvod(); Obnovit(p);
    };

    const g = document.createElement('button');
    g.textContent='→';
    g.onclick = ()=>{
      karta.setView([p.lat,p.lng], Math.max(karta.getZoom(),12));
      mki.get(p.id)?.openTooltip();
    };

    r.append(n,a,o,g);
    L2.appendChild(r);
  }
}

function Obnovit(p){
  const r = document.querySelector(`.row[data-id="${p.id}"]`);
  if(!r) return;
  const [a,o] = r.querySelectorAll('input');
  a.value = p.lat; o.value = p.lng;
  r.classList.toggle('mv', Izm(p));
}

function Izm(p){
  const q = orig.find(x=>x.id===p.id);
  if(!q) return true;
  return Math.abs(q.lat-p.lat)>1e-6 || Math.abs(q.lng-p.lng)>1e-6;
}

function Vyvod(){
  document.getElementById('out').value = JSON.stringify(to4ki,null,2);
}

async function Skopirovat(){
  const t = JSON.stringify(to4ki,null,2);
  try{
    await navigator.clipboard.writeText(t);
    Status('скопировано ('+to4ki.length+')');
  }catch(e){
    const ta = document.getElementById('out');
    ta.select(); document.execCommand('copy');
    Status('скопировано (fallback)');
  }
}

function Skachat(){
  const b = new Blob([JSON.stringify(to4ki,null,2)],{type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(b);
  a.download = 'points.json';
  a.click();
  URL.revokeObjectURL(a.href);
}

function Otkat(){
  if(!confirm('вернуть исходные координаты?')) return;
  to4ki = JSON.parse(JSON.stringify(orig));
  sloj.clearLayers(); mki.clear();
  to4ki.forEach(Poставит);
  Spisok(); Vyvod();
  Status('откат сделан');
}

document.getElementById('f').onchange = e=>{
  const fl = e.target.files[0];
  if(!fl) return;
  const r = new FileReader();
  r.onload = ()=>{
    try{
      const j = JSON.parse(r.result);
      if(!Array.isArray(j)) throw new Error('не массив');
      Zagruzit(j);
    }catch(err){ alert('плохой json: '+err.message); }
  };
  r.readAsText(fl,'utf-8');
};

document.getElementById('perez').onclick = async ()=>{
  const j = await Najdi();
  if(j) Zagruzit(j);
  else Status('не нашёл points.json — кинь файл рядом с html или выбери вручную');
};

document.getElementById('kop').onclick = Skopirovat;
document.getElementById('skach').onclick = Skachat;
document.getElementById('otkat').onclick = Otkat;

(async ()=>{
  const j = await Najdi();
  if(j) Zagruzit(j);
  else Status('points.json не найден. положи файл рядом или выбери через поле');
})();
</script>
</body>
</html>
