<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>точки</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  html,body{margin:0;height:100%;font:13px/1.4 system-ui,Arial,sans-serif}
  #app{display:flex;height:100vh}
  #map{flex:1}
  #bok{width:420px;display:flex;flex-direction:column;border-left:1px solid #bbb;background:#f6f6f6}
  #verh{padding:8px;border-bottom:1px solid #ddd}
  #lista{flex:1;overflow:auto}
  .str{display:flex;gap:4px;align-items:center;padding:3px 6px;border-bottom:1px solid #eee}
  .str input{width:92px;font:12px monospace;padding:1px 3px;border:1px solid #ccc}
  .str .ttl{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .str.hl{background:#ffe9a8}
  .str.mv .ttl::after{content:" ✱";color:#c60}
  .row{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
  button{padding:5px 9px;border:1px solid #888;background:#fff;border-radius:3px;cursor:pointer;font:inherit}
  button.ok{background:#2a7;color:#fff;border-color:#186}
  #st{font-size:12px;color:#555;padding:2px 0}
  #json{height:120px;font:11px monospace;width:100%;box-sizing:border-box}
  .drop{position:fixed;inset:0;background:rgba(0,0,0,.55);color:#fff;display:none;align-items:center;justify-content:center;font-size:22px;z-index:9999;pointer-events:none}
  .drop.on{display:flex}
</style>
</head>
<body>
<div id="app">
  <div id="map"></div>
  <div id="bok">
    <div id="verh">
      <div id="st">…</div>
      <div class="row">
        <input type="file" id="f" accept=".json,application/json">
        <button id="najdi">перечитать</button>
      </div>
      <div class="row">
        <button class="ok" id="kop">копировать</button>
        <button id="skach">скачать</button>
        <button id="otkat">откат</button>
        <button id="sbros">сброс</button>
      </div>
      <div class="row">
        <input type="text" id="poisk" placeholder="поиск по названию…" style="flex:1;padding:3px 6px;border:1px solid #ccc;border-radius:3px">
      </div>
    </div>
    <div id="lista"></div>
    <div style="padding:6px;border-top:1px solid #ddd">
      <textarea id="json" spellcheck="false"></textarea>
    </div>
  </div>
</div>
<div class="drop" id="drop">отпусти, чтобы загрузить</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const urls = [
  './points.json',
  'https://raw.githubusercontent.com/mukhanikolay-cyber/pamjat_map/main/points.json',
  'https://raw.githubusercontent.com/mukhanikolay-cyber/pamjat_map/master/points.json',
  'https://mukhanikolay-cyber.github.io/pamjat_map/points.json'
];

let orig = [];
let dann = [];
let metki = new Map();
let filter = '';

const karta = L.map('map', {zoomControl:true}).setView([53.7,27.9],7);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  maxZoom:19, attribution:'© OpenStreetMap'
}).addTo(karta);
const sloj = L.layerGroup().addTo(karta);

const $ = s => document.querySelector(s);
const st = t => { $('#st').textContent = t; };

async function najdi(){
  for(const u of urls){
    try{
      const r = await fetch(u, {cache:'no-store'});
      if(!r.ok) continue;
      const j = await r.json();
      if(Array.isArray(j) && j.length){
        st('загружено: ' + u + ' (' + j.length + ')');
        zagruzit(j);
        return;
      }
    }catch(e){}
  }
  st('файл не найден — выбери вручную или перетащи');
}

function zagruzit(arr){
  sloj.clearLayers();
  metki.clear();
  orig = JSON.parse(JSON.stringify(arr));
  dann = JSON.parse(JSON.stringify(arr));
  dann.forEach(mark);
  const to4ki = dann.filter(p => typeof p.lat === 'number' && typeof p.lng === 'number');
  if(to4ki.length){
    const b = L.latLngBounds(to4ki.map(p => [p.lat, p.lng]));
    if(b.isValid()) karta.fitBounds(b.pad(0.05));
  }
  spisok();
  vyvod();
}

function titul(p){
  return p.title || p.name || ('#' + p.id);
}

function mark(p){
  if(typeof p.lat !== 'number' || typeof p.lng !== 'number') return;
  const m = L.marker([p.lat, p.lng], {draggable:true}).addTo(sloj);
  m.bindTooltip(titul(p) + ' #' + p.id, {direction:'top', offset:[0,-6]});
  m.on('drag', e=>{
    const ll = e.target.getLatLng();
    p.lat = +ll.lat.toFixed(6);
    p.lng = +ll.lng.toFixed(6);
    obn(p);
    vyvod();
  });
  m.on('dragend', spisok);
  m.on('click', ()=>{
    const el = document.querySelector('.str[data-id="' + p.id + '"]');
    if(!el) return;
    document.querySelectorAll('.hl').forEach(x => x.classList.remove('hl'));
    el.classList.add('hl');
    el.scrollIntoView({block:'center', behavior:'smooth'});
  });
  metki.set(p.id, m);
}

function spisok(){
  const L2 = $('#lista');
  L2.innerHTML = '';
  const ff = filter.toLowerCase();
  for(const p of dann){
    const t = titul(p);
    if(ff && !t.toLowerCase().includes(ff)) continue;
    const el = document.createElement('div');
    el.className = 'str' + (izm(p) ? ' mv' : '');
    el.dataset.id = p.id;

    const n = document.createElement('span');
    n.className = 'ttl';
    n.textContent = p.id + '. ' + t;

    const a = document.createElement('input');
    a.type = 'number'; a.step = '0.000001'; a.value = p.lat;
    a.addEventListener('change', ()=>{
      p.lat = parseFloat(a.value);
      metki.get(p.id)?.setLatLng([p.lat, p.lng]);
      vyvod(); obn(p);
    });

    const o = document.createElement('input');
    o.type = 'number'; o.step = '0.000001'; o.value = p.lng;
    o.addEventListener('change', ()=>{
      p.lng = parseFloat(o.value);
      metki.get(p.id)?.setLatLng([p.lat, p.lng]);
      vyvod(); obn(p);
    });

    const g = document.createElement('button');
    g.textContent = '→';
    g.title = 'центрировать';
    g.addEventListener('click', ()=>{
      karta.setView([p.lat, p.lng], Math.max(karta.getZoom(), 12));
      metki.get(p.id)?.openTooltip();
    });

    el.append(n, a, o, g);
    L2.appendChild(el);
  }
}

function obn(p){
  const el = document.querySelector('.str[data-id="' + p.id + '"]');
  if(!el) return;
  const [a, o] = el.querySelectorAll('input');
  a.value = p.lat; o.value = p.lng;
  el.classList.toggle('mv', izm(p));
}

function izm(p){
  const q = orig.find(x => x.id === p.id);
  if(!q) return true;
  return Math.abs(q.lat - p.lat) > 1e-6 || Math.abs(q.lng - p.lng) > 1e-6;
}

function vyvod(){
  $('#json').value = JSON.stringify(dann, null, 2);
}

async function kop(){
  const t = JSON.stringify(dann, null, 2);
  try{
    await navigator.clipboard.writeText(t);
    st('скопировано (' + dann.length + ')');
  }catch(e){
    const ta = $('#json');
    ta.select(); document.execCommand('copy');
    st('скопировано (fallback)');
  }
}

function skach(){
  const b = new Blob([JSON.stringify(dann, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(b);
  a.download = 'points.json';
  a.click();
  URL.revokeObjectURL(a.href);
}

function otkat(){
  if(!confirm('вернуть исходные координаты?')) return;
  dann = JSON.parse(JSON.stringify(orig));
  sloj.clearLayers(); metki.clear();
  dann.forEach(mark);
  spisok(); vyvod();
  st('откат сделан');
}

function pro4itat(fl){
  const r = new FileReader();
  r.onload = ()=>{
    try{
      const j = JSON.parse(r.result);
      if(!Array.isArray(j)) throw new Error('не массив');
      st('файл: ' + fl.name + ' (' + j.length + ')');
      zagruzit(j);
    }catch(err){ alert('плохой json: ' + err.message); }
  };
  r.readAsText(fl, 'utf-8');
}

$('#f').addEventListener('change', e=>{
  const fl = e.target.files[0];
  if(fl) pro4itat(fl);
});

$('#najdi').addEventListener('click', najdi);
$('#kop').addEventListener('click', kop);
$('#skach').addEventListener('click', skach);
$('#otkat').addEventListener('click', otkat);
$('#sbros').addEventListener('click', ()=>{
  document.querySelectorAll('.hl').forEach(x => x.classList.remove('hl'));
});
$('#poisk').addEventListener('input', e=>{
  filter = e.target.value;
  spisok();
});

let dcount = 0;
window.addEventListener('dragenter', e=>{
  e.preventDefault();
  dcount++;
  $('#drop').classList.add('on');
});
window.addEventListener('dragleave', ()=>{
  dcount--;
  if(dcount <= 0){ dcount = 0; $('#drop').classList.remove('on'); }
});
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', e=>{
  e.preventDefault();
  dcount = 0; $('#drop').classList.remove('on');
  const fl = e.dataTransfer.files[0];
  if(fl) pro4itat(fl);
});

najdi();
</script>
</body>
</html>
