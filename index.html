<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="icon" href="data:,">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карта освобождения Беларуси 1943–1944</title>

    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />

    <style>
        html, body {
            margin: 0;
            height: 100%;
            font-family: system-ui, sans-serif;
        }

        #map {
            height: 100vh;
            width: 100%;
        }

        /*маркер*/
        .custom-marker {
            width: 24px;
            height: 24px;
            background: radial-gradient(circle at 30% 30%, #ffdd57, #d62828);
            border: 2px solid #fff;
            border-radius: 50% 50% 50% 0;
            transform: rotate(-45deg);
            box-shadow: 0 0 6px rgba(0,0,0,.4);
            position: relative;
        }

            .custom-marker::after {
                content: '';
                position: absolute;
                inset: 6px;
                background: #fff;
                border-radius: 50%;
            }
            
            .custom-marker.important::before {
                content: '';
                position: absolute;
                inset: -6px;
                border-radius: 50%;
                border: 2px solid #d62828;
                animation: pulse 1.8s infinite;
            }

        @keyframes pulse {
            0% {
                transform: scale(0.8);
                opacity: 1;
            }

            100% {
                transform: scale(1.8);
                opacity: 0;
            }
        }
        .leaflet-popup-content {
            max-width: 280px;
            line-height: 1.4;
        }

        .popup-title {
            font-size: 1.05em;
            color: #b30000;
        }

        .popup-meta {
            color: #555;
            font-size: 0.9em;
            margin: 4px 0;
        }

        .popup-desc {
            margin: 6px 0;
        }

        .popup-memory {
            font-size: 0.85em;
            color: #333;
            background: #f8f8f8;
            padding: 6px;
            border-radius: 4px;
        }

        .popup-link {
            display: inline-block;
            margin-top: 6px;
            color: #0b5ed7;
            text-decoration: none;
            font-weight: 600;
        }

            .popup-link:hover {
                text-decoration: underline;
            }
    </style>
</head>
<body>
    <div id="map"></div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    <script src="script.js"></script>
</body>
</html>
