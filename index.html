<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <title>Карта освобождения Беларуси 1943–1944</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="map"></div>

  <div id="left-panel" class="left-panel">
    <button id="left-toggle" class="left-toggle" type="button" aria-label="Меню">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"></polyline></svg>
    </button>
    <div class="left-body">
      <button id="theme-btn" class="left-btn" type="button" aria-label="Тема">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
      </button>
      <button id="lang-btn-left" class="left-btn lang-switch" type="button" data-lang="by">BY</button>
    </div>
  </div>

  <aside id="panel" class="panel">
    <div class="panel-head">
      <div class="search-box">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="11" cy="11" r="7"></circle>
          <path d="M21 21l-4.3-4.3"></path>
        </svg>
        <input id="search" type="text" placeholder="Поиск города..." autocomplete="off" spellcheck="false">
        <button id="search-clear" class="search-clear" type="button" hidden aria-label="Очистить">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"></line><line x1="18" y1="6" x2="6" y2="18"></line></svg>
        </button>
      </div>
      <div class="sort-row">
        <select id="sort-select" class="sort-select" aria-label="Сортировка"></select>
      </div>
    </div>
    <div id="list-view" class="panel-view"></div>
    <div id="detail-view" class="panel-view" hidden></div>
  </aside>

  <div id="slider-bar" class="slider-bar">
    <div class="slider-head">
      <span class="slider-label">Период освобождения</span>
      <span class="slider-values">
        <b id="date-low">...</b><span class="sep">-</span><b id="date-high">...</b>
      </span>
    </div>
    <div class="range-wrap">
      <div class="range-track"><div id="range-fill" class="range-fill"></div></div>
      <input id="range-lo" type="range" min="0" max="1" step="1" value="0">
      <input id="range-hi" type="range" min="0" max="1" step="1" value="1">
    </div>
  </div>

  <div id="lightbox" class="lightbox" hidden>
    <button class="lightbox-nav lightbox-prev" id="lightbox-prev" type="button" aria-label="Предыдущая" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 6 9 12 15 18"></polyline></svg>
    </button>
    <button class="lightbox-nav lightbox-next" id="lightbox-next" type="button" aria-label="Следующая" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"></polyline></svg>
    </button>
    <div class="lightbox-num" id="lightbox-num" hidden></div>
    <button class="lightbox-close" type="button" aria-label="Закрыть">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"></line><line x1="18" y1="6" x2="6" y2="18"></line></svg>
    </button>
    <div class="lightbox-inner">
      <img id="lightbox-img" src="" alt="">
      <div id="lightbox-caption" class="lightbox-caption"></div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script src="script.js"></script>
</body>
</html>
