<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Карта освобождения Беларуси 1943–1944</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="map"></div>

  <aside id="panel" class="panel">
    <div class="panel-head">
      <div class="search-box">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="11" cy="11" r="7"></circle>
          <path d="M21 21l-4.3-4.3"></path>
        </svg>
        <input id="search" type="text" placeholder="Поиск..." autocomplete="off" spellcheck="false">
        <button id="search-clear" class="search-clear" type="button" hidden>×</button>
      </div>
    </div>
    <div id="list-view" class="panel-view"></div>
    <div id="detail-view" class="panel-view" hidden></div>
  </aside>

  <div id="slider-bar" class="slider-bar">
    <div class="slider-head">
      <span class="slider-label">Период освобождения</span>
      <span class="slider-values">
        <b id="date-low">—</b><span class="sep">…</span><b id="date-high">—</b>
      </span>
    </div>
    <div class="range-wrap">
      <div class="range-track"><div id="range-fill" class="range-fill"></div></div>
      <input id="range-lo" type="range" min="0" max="1" step="1" value="0">
      <input id="range-hi" type="range" min="0" max="1" step="1" value="1">
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script src="script.js"></script>
</body>
</html>
